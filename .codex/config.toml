approval_policy = "on-request"
default_permissions = "banking-safe"

[windows]
sandbox = "mxc"

[permissions.banking-safe]
description = "Read-only project access with internet"
extends = ":read-only"

[permissions.banking-safe.filesystem.":workspace_roots"]
"imports" = "deny"
"transactions.db" = "deny"
"finance.db" = "deny"

[permissions.banking-safe.network]
enabled = true
